  :root { --bg: #FFE08A; --ink: #e63971; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    transition: background-color .6s ease;
    font-family: "LetterCardsSans", "Andika", "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700;
    color: #3a2e5c;
    cursor: pointer;
  }
  #stage {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2vh;
    padding: max(env(safe-area-inset-top), 64px) max(env(safe-area-inset-right), 3vw)
             max(env(safe-area-inset-bottom), 3vh) max(env(safe-area-inset-left), 3vw);
  }

  /* Big letter: "A a" */
  #letter {
    display: flex; align-items: baseline; justify-content: center;
    gap: .28em;
    font-size: min(34vh, 48vw);
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 .045em 0 rgba(58,46,92,.18);
    transition: font-size .35s cubic-bezier(.3,1.3,.5,1), color .4s;
    will-change: transform;
  }
  #letter span { display: block; padding-bottom: .04em; }
  #letter.float { animation: float 3s ease-in-out infinite; }
  #letter.pop { animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
  #letter.enter { animation: enter .45s ease-out both; }
  #stage.rev #letter { font-size: min(13vh, 24vw); }

  /* Photo */
  #photoWrap {
    width: min(84vw, 42vh);
    aspect-ratio: 1 / 1;
    border-radius: min(6vw, 3.5vh);
    background: #fff;
    padding: min(2.2vw, 1.1vh);
    box-shadow: 0 1.2vh 2.4vh rgba(58,46,92,.18);
    animation: photoIn .55s cubic-bezier(.3,1.5,.5,1) both;
  }
  #photo {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    border-radius: min(4.5vw, 2.6vh);
    background: #f3f0f7;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #label {
    min-height: 10vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #prompt {
    font-size: min(6.5vh, 9.5vw);
    font-weight: 700;
    opacity: .75;
  }
  #word {
    font-size: min(9.5vh, 14vw);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 .6vh 0 rgba(58,46,92,.35), 0 0 2vh rgba(58,46,92,.2);
    -webkit-text-stroke: max(2px, .35vh) #3a2e5c;
    paint-order: stroke fill;
    white-space: nowrap;
    animation: nameIn .55s cubic-bezier(.3,1.6,.5,1) both;
  }
  #word .first { color: var(--ink); font-size: 1.15em; }
  .hidden { display: none !important; }

  #mainBtn {
    font: inherit;
    font-size: min(6vh, 8vw);
    font-weight: 700;
    color: #fff;
    background: #ff7aa2;
    border: none;
    border-radius: 999px;
    min-height: 10.5vh; min-width: min(60vw, 50vh);
    padding: 1.4vh 6vh;
    box-shadow: 0 1vh 0 rgba(0,0,0,.18);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .1s, box-shadow .1s, background-color .3s;
  }
  #mainBtn.next { background: #5bbf8a; }
  #mainBtn:active { transform: translateY(.8vh); box-shadow: 0 .2vh 0 rgba(0,0,0,.18); }
  #mainBtn:focus { outline: none; }
  #mainBtn:focus-visible { outline: 4px solid #3a2e5c; outline-offset: 4px; }
  .emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

  /* Parent controls: small, top corners, semi-transparent */
  .parent {
    position: fixed; top: max(env(safe-area-inset-top), 8px);
    z-index: 10;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 2px solid rgba(58,46,92,.25);
    background: rgba(255,255,255,.45);
    color: #3a2e5c;
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: .55;
    cursor: pointer;
    touch-action: manipulation;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .parent:active { opacity: 1; }
  #backBtn { left: max(env(safe-area-inset-left), 8px); }
  body:has(#trace:not(.hidden)) #moreGames { display: none; } /* keep it away from the tracing buttons */
  #moreGames {
    position: fixed; z-index: 10;
    left: max(env(safe-area-inset-left), 6px); bottom: max(env(safe-area-inset-bottom), 4px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; line-height: 1.2;
    color: #3a2e5c; opacity: .45; text-decoration: none; padding: 6px;
  }
  #soundBtn { right: max(env(safe-area-inset-right), 8px); }
  #orderBtn { right: calc(max(env(safe-area-inset-right), 8px) + 52px); }
  #orderBtn .abc { font-family: "LetterCardsSans", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  #backBtn:disabled { opacity: .2; }
  #credits {
    position: fixed; z-index: 10;
    right: max(env(safe-area-inset-right), 6px); bottom: max(env(safe-area-inset-bottom), 4px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400;
    color: #3a2e5c; opacity: .35; text-decoration: none; padding: 6px;
  }
  #toast {
    position: fixed; z-index: 11; top: calc(max(env(safe-area-inset-top), 8px) + 52px); right: max(env(safe-area-inset-right), 8px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600;
    background: rgba(58,46,92,.8); color: #fff; padding: 6px 10px; border-radius: 10px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* Confetti */
  .confetti {
    position: fixed; top: 45%; left: 50%;
    width: 2.2vh; height: 2.2vh; border-radius: 50%;
    pointer-events: none; z-index: 5;
    animation: burst 1.1s ease-out forwards;
    will-change: transform, opacity;
  }
  .confetti.sq { border-radius: 3px; }

  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-1.5vh) rotate(1.5deg); } }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18) rotate(-6deg); } 65% { transform: scale(.95) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes enter { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes nameIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes photoIn { from { transform: scale(.5) rotate(-4deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.6); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; }
  }


  /* ---------- Tracing screen ---------- */
  #trace {
    position: fixed; inset: 0; z-index: 2;

  }

  #tNext.count .bar { animation: fillBar 3s linear forwards; }

  @keyframes inkFade { to { opacity: 0; } }
  @keyframes dotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  @keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* Landscape: photo on the left, letter + word + button on the right */

    #stage { padding-top: max(env(safe-area-inset-top), 3vh); gap: 1.5vh; }
    #letter { font-size: min(46vh, 30vw); }
    #stage.rev {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto auto;
      grid-template-areas: "photo letter" "photo label" "photo btn";
      column-gap: 6vw; row-gap: 2vh;
      justify-content: center; align-content: center; align-items: center; justify-items: center;
      padding-left: max(env(safe-area-inset-left), 64px); padding-right: max(env(safe-area-inset-right), 64px);
    }

    #stage.rev #letter { grid-area: letter; font-size: min(24vh, 14vw); }
    #stage.rev #label { grid-area: label; min-height: 0; }

    #prompt { font-size: min(8vh, 6vw); }
    #mainBtn { min-height: 13vh; font-size: min(7.5vh, 5vw); padding: 1vh 6vh; min-width: min(40vw, 60vh); }
    #toast { top: max(env(safe-area-inset-top), 8px); right: calc(max(env(safe-area-inset-right), 8px) + 104px); }

      column-gap: 4vw; row-gap: 3vh;

    #tBtns { grid-area: btns; flex-direction: column; align-self: start; width: auto; gap: 2.5vh; }
    .tpill { font-size: min(9vh, 5vw); }

<body>
<button id="backBtn" class="parent" type="button" aria-label="Previous card" title="Back (Left arrow)">&#x2B05;&#xFE0F;</button>
<button id="orderBtn" class="parent" type="button" aria-label="Order: A to Z" title="Order: A to Z / Mix"><span class="abc">ABC</span></button>
<button id="soundBtn" class="parent" type="button" aria-label="Sound on" title="Sound on/off">&#x1F50A;</button>
<a id="credits" href="credits.html">Photo credits</a>
<a id="moreGames" href="../games.html">&#x25A6; More games</a>
<div id="toast" role="status" aria-live="polite"></div>

<main id="stage">
  <div id="letter" class="float" role="img" aria-label="What letter is this?"><span id="up">A</span><span id="lo">a</span></div>
  <div id="photoWrap" class="hidden"><img id="photo" alt="" decoding="async" draggable="false"></div>
  <div id="label">
    <div id="prompt">What letter is this?</div>
    <div id="word" class="hidden" aria-live="polite"></div>
  </div>
  <button id="mainBtn" type="button">Show me! <span class="emo">&#x1F440;</span></button>
</main>

<section id="trace" class="hidden" aria-label="Tracing">
  <div id="tHead"><span id="tUp" class="tpill on">A</span><span id="tLo" class="tpill">a</span></div>
  <div id="tBox"><svg id="tSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trace the letter" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="tBtns">
    <button id="tClear" class="tbtn" type="button" aria-label="Try again">&#x21BA; Again</button>
    <button id="tSkip" class="tbtn" type="button" aria-label="Skip">Skip <span class="emo">&#x23ED;&#xFE0F;</span></button>
    <button id="tNext" class="tbtn hidden" type="button" aria-label="Next"><span class="bar"></span><span class="lbl">Next</span></button>
  </div>
</section>

<script>
(function () {
  "use strict";

  var CARDS = [
    ["A", "apple"], ["B", "ball"], ["C", "cat"], ["D", "dog"], ["E", "egg"], ["F", "fish"],
    ["G", "goat"], ["H", "hat"], ["I", "ice cream"], ["J", "juice"], ["K", "kite"], ["L", "lion"],
    ["M", "moon"], ["N", "nest"], ["O", "orange"], ["P", "pig"], ["Q", "queen"], ["R", "rabbit"],
    ["S", "sun"], ["T", "tree"], ["U", "umbrella"], ["V", "violin"], ["W", "watermelon"],
    ["X", "xylophone"], ["Y", "yo-yo"], ["Z", "zebra"]
  ].map(function (c) {
    var k = c[0].toLowerCase();
    return { L: c[0], w: c[1], img: "img/" + k + ".jpg", audio: "audio/" + k + ".mp3",
             say: c[0] + "! " + c[0] + " is for " + c[1] + "!" };
  });
  var N = CARDS.length;

  var COLORS = ["#FFE08A", "#FFC8DD", "#BDE0FE", "#CDEAC0", "#FFD6A5", "#E2CFFF",
                "#A8E6CF", "#FDFFB6", "#FFADAD", "#9BF6FF", "#CAFFBF", "#FFC6FF"];
  var INKS = ["#e63971", "#ff6b00", "#1f6fd1", "#0e9a62", "#8338ec", "#d62828", "#c2185b", "#00838f"];
  var CONFETTI_COLORS = ["#ff5d8f", "#ffbe0b", "#3a86ff", "#06d6a0", "#8338ec", "#fb5607"];

  var $ = function (id) { return document.getElementById(id); };
  var elStage = $("stage"), elLetter = $("letter"), elUp = $("up"), elLo = $("lo");
  var elPhotoWrap = $("photoWrap"), elPhoto = $("photo");
  var elPrompt = $("prompt"), elWord = $("word"), elMain = $("mainBtn");
  var elBack = $("backBtn"), elSound = $("soundBtn"), elOrder = $("orderBtn"), elToast = $("toast");

  var history = [];   // card indices shown, in order
  var pos = -1;       // current position in history
  var deck = [];      // remaining shuffled indices (Mix mode)
  var revealed = false;
  var mode = "q";     // "q" = question, "rev" = revealed, "trace" = tracing screen
  var revealAt = 0, lastReplay = 0;
  var colorIdx = Math.floor(Math.random() * COLORS.length);
  var inkIdx = Math.floor(Math.random() * INKS.length);

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var soundOn = load("lfc-sound") !== "off";
  var mix = load("lfc-mix") === "on";

  // ---------- Audio (recorded child voice), speechSynthesis only as a fallback ----------
  var audioCache = {};
  var current = null;          // Audio currently playing
  function getAudio(i) {
    if (audioCache[i]) return audioCache[i];
    var a = null;
    try {
      a = new Audio();
      a.preload = "auto";
      a.src = CARDS[i].audio;
      try { a.load(); } catch (e) {}
    } catch (e) { a = null; }
    audioCache[i] = a;
    return a;
  }

  var synth = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    try {
      var vs = synth.getVoices() || [];
      var en = vs.filter(function (v) { return /^en[-_]/i.test(v.lang) || v.lang === "en"; });
      var pref = ["Samantha", "Karen", "Moira", "Tessa", "Google US English", "Microsoft Ana", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira"];
      for (var i = 0; i < pref.length && !voice; i++) {
        for (var j = 0; j < en.length; j++) { if (en[j].name.indexOf(pref[i]) === 0) { voice = en[j]; break; } }
      }
      if (!voice) voice = en.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
    } catch (e) { voice = null; }
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener ? synth.addEventListener("voiceschanged", pickVoice) : (synth.onvoiceschanged = pickVoice); } catch (e) {}
  }
  function speakFallback(text) {
    if (!synth || !soundOn) return;
    try {
      synth.cancel();
      if (synth.paused) synth.resume();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (voice && voice.lang) || "en-US";
      if (voice) u.voice = voice;
      u.rate = 0.8; u.pitch = 1.3; u.volume = 1;
      synth.speak(u);
    } catch (e) { /* sound is optional */ }
  }

  function stopSound() {
    if (current) { try { current.pause(); current.currentTime = 0; } catch (e) {} current = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
  }

  function playCard(i) {
    if (!soundOn) return;
    stopSound();
    var card = CARDS[i], a = getAudio(i), myPos = pos, fellBack = false;
    function fallback() {
      if (fellBack || pos !== myPos || !revealed || !soundOn) return;
      fellBack = true;
      speakFallback(card.say);
    }
    if (!a || a.error) {
      // cached element failed earlier: try a fresh one, else fall back
      audioCache[i] = null;
      a = getAudio(i);
      if (!a) { fallback(); return; }
    }
    current = a;
    a.onerror = fallback;
    try {
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function (err) {
        if (err && err.name === "AbortError") return; // interrupted by Next/Back: expected
        fallback();
      });
    } catch (e) { fallback(); }
  }

  var fx = null, warmed = {};
  function warmAudio(src) {
    if (warmed[src]) return;
    try { var a = new Audio(); a.preload = "auto"; a.src = src; try { a.load(); } catch (e) {} warmed[src] = a; } catch (e) {}
  }
  function playFx(src, text, alt) {
    if (!soundOn) return;
    stopSound();
    try { if (!fx) { fx = new Audio(); fx.preload = "auto"; } } catch (e) { fx = null; }
    if (!fx) { speakFallback(text); return; }
    var failed = false;
    function fb() {
      if (failed || !soundOn) return;
      failed = true;
      if (alt) playFx(alt, text); else speakFallback(text);
    }
    current = fx;
    fx.onerror = fb;
    try {
      fx.src = src;
      var p = fx.play();
      if (p && p.catch) p.catch(function (err) { if (err && err.name === "AbortError") return; fb(); });
    } catch (e) { fb(); }
  }

  function renderSoundBtn() {
    elSound.innerHTML = soundOn ? "&#x1F50A;" : "&#x1F507;";
    elSound.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  }
  renderSoundBtn();

  function renderOrderBtn() {
    elOrder.innerHTML = mix ? "&#x1F500;" : '<span class="abc">ABC</span>';
    elOrder.setAttribute("aria-label", mix ? "Order: mixed" : "Order: A to Z");
    elOrder.title = mix ? "Mixed order (tap for A to Z)" : "A to Z order (tap to mix)";
  }
  renderOrderBtn();

  var toastTimer = null;
  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 1300);
  }

  // ---------- Deck / order ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // Mix: every letter once before any repeats; never the same letter twice in a row.
  function refillDeck(exclude) {
    deck = shuffle(CARDS.map(function (_, i) { return i; }).filter(function (i) { return i !== exclude; }));
  }
  function peekNext() {
    if (pos < history.length - 1) return history[pos + 1];
    var cur = pos >= 0 ? history[pos] : -1;
    if (!mix) return (cur + 1) % N;          // A..Z, then back to A
    if (!deck.length) refillDeck(cur);
    return deck[deck.length - 1];
  }
  function takeNext() {
    var i = peekNext();
    if (mix && pos >= history.length - 1) deck.pop();
    return i;
  }

  function preload(i) {
    if (i == null || i < 0) return;
    try { var im = new Image(); im.decoding = "async"; im.src = CARDS[i].img; } catch (e) {}
    getAudio(i);
  }

  // ---------- Rendering ----------
  function restartAnim(el, cls) {
    el.classList.remove("pop", "enter", "float");
    void el.offsetWidth; // reflow to restart animation
    if (cls) el.classList.add(cls);
  }

  function showCard(keepColors) {
    var c = CARDS[history[pos]];
    revealed = false;
    mode = "q";
    if (!elTrace.classList.contains("hidden")) leaveTrace();
    elStage.classList.remove("rev");
    if (!keepColors) {
      colorIdx = (colorIdx + 1 + Math.floor(Math.random() * (COLORS.length - 1))) % COLORS.length;
      inkIdx = (inkIdx + 1 + Math.floor(Math.random() * (INKS.length - 1))) % INKS.length;
    }
    document.body.style.setProperty("--bg", COLORS[colorIdx]);
    document.body.style.setProperty("--ink", INKS[inkIdx]);
    document.body.style.backgroundColor = COLORS[colorIdx];
    elUp.textContent = c.L;
    elLo.textContent = c.L.toLowerCase();
    elLetter.setAttribute("aria-label", "What letter is this?");
    restartAnim(elLetter, "enter");
    setTimeout(function () { if (!revealed) { elLetter.classList.remove("enter"); elLetter.classList.add("float"); } }, 460);
    // load this card's photo now (hidden) so the reveal is instant
    elPhotoWrap.classList.add("hidden");
    elPhoto.alt = c.w;
    if (elPhoto.getAttribute("src") !== c.img) { elPhotoWrap.dataset.failed = ""; elPhoto.src = c.img; }
    elPrompt.classList.remove("hidden");
    elWord.classList.add("hidden");
    elWord.textContent = "";
    elMain.innerHTML = 'Show me! <span class="emo">&#x1F440;</span>';
    elMain.classList.remove("next");
    elMain.setAttribute("aria-label", "Show me");
    elBack.disabled = pos <= 0;
    getAudio(history[pos]);
    preload(peekNext());
  }

  function reveal(quiet) {
    var i = history[pos], c = CARDS[i];
    revealed = true;
    if (!quiet && window.REWARD) window.REWARD.learnReveal();  // light reward every 5th card
    mode = "rev";
    revealAt = Date.now();
    elStage.classList.add("rev");
    elPrompt.classList.add("hidden");
    elWord.innerHTML = '<span class="first">' + c.w.charAt(0) + "</span>" + c.w.slice(1);
    elWord.classList.remove("hidden");
    elWord.style.animation = "none"; void elWord.offsetWidth; elWord.style.animation = "";
    if (elPhotoWrap.dataset.failed !== "1") elPhotoWrap.classList.remove("hidden");
    elPhotoWrap.style.animation = "none"; void elPhotoWrap.offsetWidth; elPhotoWrap.style.animation = "";
    elLetter.setAttribute("aria-label", c.L + " is for " + c.w);
    restartAnim(elLetter, "pop");
    elMain.innerHTML = 'Trace it! <span class="emo">&#x270F;&#xFE0F;</span>';
    elMain.classList.add("next");
    elMain.setAttribute("aria-label", "Trace it");
    if (!quiet) { confetti(); playCard(i); }
    warmAudio("audio/trace/up-" + c.L.toLowerCase() + ".mp3");
    for (var k = 1; k <= 5; k++) warmAudio("audio/trace/praise" + k + ".mp3");
  }

  // Tap on the photo/letter/background after the reveal = hear it again (never skips ahead).
  function replay() {
    var now = Date.now();
    if (now - lastReplay < 1000 || now - revealAt < 900) return;
    if (current && !current.paused && !current.ended) return;
    lastReplay = now;
    restartAnim(elLetter, "pop");
    playCard(history[pos]);
  }

  function next() {
    stopSound();
    var i = takeNext();
    if (pos < history.length - 1) pos++;
    else { history.push(i); pos = history.length - 1; }
    showCard();
  }

  // Back: lowercase trace -> uppercase trace -> revealed card -> previous card
  function back() {
    if (mode === "trace") {
      stopSound();
      if (tPart === 1) startTrace(0, true);
      else { leaveTrace(); showCard(true); reveal(true); }
      return;
    }
    if (pos <= 0) return;
    stopSound();
    pos--;
    showCard();
  }

  // Debounce so rapid toddler taps don't skip cards.
  var lastAdvance = 0;
  function debounced() {
    var now = Date.now();
    if (now - lastAdvance < 500) return false;
    lastAdvance = now;
    return true;
  }
  // Keyboard Space / Enter / Right: reveal -> trace -> (skip or next) -> ...
  function primary() {
    if (mode === "rev" && Date.now() - revealAt < 700) return;
    if (!debounced()) return;
    if (mode === "q") reveal();
    else if (mode === "rev") startTrace(0);
    else if (mode === "trace") traceNext();
  }

  var confettiLive = 0;
  function confetti(stars) {
    if (confettiLive > 0) return; // keep it light if tapping fast
    var n = stars ? 24 : 18;
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      var star = stars && i % 3 === 0;
      d.className = "confetti" + (star ? " star emo" : (i % 3 === 0 ? " sq" : ""));
      if (star) d.textContent = "\u2B50";

      var dist = 25 + Math.random() * 20; // in vmin
      d.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "vmin");
      d.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "vmin");

    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  elBack.addEventListener("click", function (ev) { ev.stopPropagation(); back(); elBack.blur(); });
  elSound.addEventListener("click", function (ev) {
    ev.stopPropagation();
    soundOn = !soundOn;
    store("lfc-sound", soundOn ? "on" : "off");
    if (!soundOn) stopSound();
    renderSoundBtn();
    elSound.blur();
  });
  elOrder.addEventListener("click", function (ev) {
    ev.stopPropagation();
    mix = !mix;
    store("lfc-mix", mix ? "on" : "off");
    // keep the current card; everything after it follows the new order
    history = history.slice(0, pos + 1);
    deck = [];
    renderOrderBtn();
    toast(mix ? "Mixed order" : "A to Z order");
    preload(peekNext());
    elOrder.blur();
  });

  document.addEventListener("keydown", function (ev) {
    if (document.body.classList.contains("pm-alt")) return;  // a challenge mode is showing
    var k = ev.key;
    if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "Enter") {
      ev.preventDefault();
      if (!ev.repeat) primary();
    } else if (k === "ArrowLeft") {
      ev.preventDefault();
      if (!ev.repeat) back();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) return;
    stopSound();
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; elTNext.classList.remove("count"); } // wait for a tap instead
  });

  // Block pinch-zoom (iOS Safari ignores user-scalable=no) and double-tap zoom.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // used by play/play.js when switching modes: silence and cancel the trace auto-advance
  window.__learnStop = function () {
    stopSound(); dropTraceReward();
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; elTNext.classList.remove("count"); }
  };
  // Start: A (or a random letter in Mix mode)
  next();
})();
</script>
<script src="../play/play.js?v=3"></script>
<script src="../shared/reward.js?v=4"></script>
<script src="../play/letters.js?v=3"></script>
</body>
