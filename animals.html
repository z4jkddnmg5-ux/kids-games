<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFE08A">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<title>Animal Flash Cards</title>
<link rel="stylesheet" href="play/play.css?v=3">
<link rel="stylesheet" href="shared/reward.css?v=4">
<style>
  :root { --bg: #FFE08A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    transition: background-color .6s ease;
    font-family: "Arial Rounded MT Bold", "Nunito", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
    color: #3a2e5c;
    cursor: pointer;
  }
  #stage {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5vh;
    padding: calc(max(env(safe-area-inset-top), 8px) + 52px) max(env(safe-area-inset-right), 3vw)
             max(env(safe-area-inset-bottom), 2.5vh) max(env(safe-area-inset-left), 3vw);
  }
  #animal {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    animation: float 3.5s ease-in-out infinite;
    will-change: transform;
  }
  #animal.pop { animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
  #animal.enter { animation: enter .4s ease-out both; }
  .photo {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    margin: auto;
    width: auto; height: auto;
    max-width: calc(100% - 16px);
    max-height: calc(100% - 16px);
    border-radius: 28px;
    background: #fff;
    box-shadow: 0 0 0 7px #fff, 0 1.4vh 2.6vh rgba(58,46,92,.28);
    -webkit-user-drag: none; user-select: none;
    pointer-events: none;
    transition: opacity .15s ease;
  }
  .photo.loading { opacity: 0; }
  #emoji {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color", sans-serif;
    font-size: min(40vh, 70vw);
    line-height: 1;
    filter: drop-shadow(0 1.2vh 1.2vh rgba(0,0,0,.12));
  }
  #side {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5vh;
    width: 100%;
  }
  #label {
    min-height: 12vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  #prompt {
    font-size: min(6.5vh, 10vw);
    font-weight: 700;
    opacity: .75;
  }
  #name {
    font-size: min(12vh, 17vw);
    font-weight: 900;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 .6vh 0 rgba(58,46,92,.35), 0 0 2vh rgba(58,46,92,.25);
    -webkit-text-stroke: max(2px, .4vh) #3a2e5c;
    paint-order: stroke fill;
    animation: nameIn .55s cubic-bezier(.3,1.6,.5,1) both;
  }
  .hidden { display: none !important; }
  #mainBtn {
    font: inherit;
    font-size: min(6vh, 8vw);
    font-weight: 900;
    color: #fff;
    background: #ff7aa2;
    border: none;
    border-radius: 999px;
    min-height: 10vh; min-width: min(60vw, 50vh);
    padding: 1.5vh 6vh;
    box-shadow: 0 1vh 0 rgba(0,0,0,.18);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .1s, box-shadow .1s, background-color .3s;
  }
  #mainBtn.next { background: #5bbf8a; }
  #mainBtn:active { transform: translateY(.8vh); box-shadow: 0 .2vh 0 rgba(0,0,0,.18); }
  #mainBtn:focus { outline: none; }
  #mainBtn:focus-visible { outline: 4px solid #3a2e5c; outline-offset: 4px; }

  /* Parent controls: small, top corners, semi-transparent */
  .parent {
    position: fixed; top: max(env(safe-area-inset-top), 8px);
    z-index: 10;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 2px solid rgba(58,46,92,.25);
    background: rgba(255,255,255,.45);
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: .55;
    cursor: pointer;
    touch-action: manipulation;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .parent:active { opacity: 1; }
  #backBtn { left: max(env(safe-area-inset-left), 8px); }
  #moreGames {
    position: fixed; z-index: 10;
    left: max(env(safe-area-inset-left), 6px); bottom: max(env(safe-area-inset-bottom), 4px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; line-height: 1.2;
    color: #3a2e5c; opacity: .45; text-decoration: none; padding: 6px;
  }
  #soundBtn { right: max(env(safe-area-inset-right), 8px); }
  #backBtn:disabled { opacity: .2; }

  #credits {
    position: fixed; z-index: 10;
    right: max(env(safe-area-inset-right), 6px);
    bottom: max(env(safe-area-inset-bottom), 4px);
    font: 11px/1.2 system-ui, sans-serif;
    color: rgba(58,46,92,.5);
    text-decoration: none;
    padding: 2px 4px;
  }

  /* Confetti */
  .confetti {
    position: fixed; top: 45%; left: 50%;
    width: 2.2vh; height: 2.2vh; border-radius: 50%;
    pointer-events: none; z-index: 5;
    animation: burst 1.1s ease-out forwards;
    will-change: transform, opacity;
  }
  .confetti.sq { border-radius: 3px; }

  @keyframes float { 0%,100% { transform: translateY(0) rotate(-.8deg); } 50% { transform: translateY(-1vh) rotate(.8deg); } }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.07) rotate(-2.5deg); } 65% { transform: scale(.98) rotate(1.5deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes enter { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes nameIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.6); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; }
  }
  /* Landscape phones/tablets: photo on the left, name + button on the right */
  @media (orientation: landscape) and (min-aspect-ratio: 5/4) {
    #stage {
      flex-direction: row; gap: 3vw;
      padding: max(env(safe-area-inset-top), 3vh) calc(max(env(safe-area-inset-right), 8px) + 52px)
               max(env(safe-area-inset-bottom), 4vh) calc(max(env(safe-area-inset-left), 8px) + 52px);
    }
    #animal { height: 100%; width: auto; flex: 1 1 0; min-width: 0; }
    #side { width: 34vw; height: 100%; gap: 4vh; }
    #prompt { font-size: min(9vh, 5.5vw); }
    #name { font-size: min(16vh, 8vw); }
    #mainBtn { min-width: 0; width: 100%; min-height: 16vh; font-size: min(8vh, 4.5vw); padding: 1vh 3vw; }
    #emoji { font-size: min(60vh, 40vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    #animal, #animal.pop, #animal.enter, #name { animation: none; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<button id="backBtn" class="parent" type="button" aria-label="Previous card" title="Back (Left arrow)">&#x2B05;&#xFE0F;</button>
<button id="soundBtn" class="parent" type="button" aria-label="Sound on" title="Sound on/off">&#x1F50A;</button>

<main id="stage">
  <div id="animal" role="img" aria-label="Who is this?"><div id="emoji" class="hidden" aria-hidden="true"></div></div>
  <div id="side">
    <div id="label">
      <div id="prompt">Who is this?</div>
      <div id="name" class="hidden" aria-live="polite"></div>
    </div>
    <button id="mainBtn" type="button">Show me! &#x1F440;</button>
  </div>
</main>
<a id="credits" href="credits.html">Photo credits</a>
<a id="moreGames" href="./">&#x25A6; More games</a>

<script>
(function () {
  "use strict";

  // Each animal: real photo in img/<id>.jpg, child-voice recording in audio/<id>.mp3.
  // The emoji is only shown if the photo fails to load; `say` is the speechSynthesis
  // fallback if the recording can't play.
  var ANIMALS = [
    { id: "dog",       e: "\u{1F436}", name: "Dog",       say: "The dog says woof woof!" },
    { id: "cat",       e: "\u{1F431}", name: "Cat",       say: "The cat says meow!" },
    { id: "cow",       e: "\u{1F42E}", name: "Cow",       say: "The cow says moo!" },
    { id: "pig",       e: "\u{1F437}", name: "Pig",       say: "The pig says oink oink!" },
    { id: "horse",     e: "\u{1F434}", name: "Horse",     say: "The horse says neigh!" },
    { id: "sheep",     e: "\u{1F411}", name: "Sheep",     say: "The sheep says baa!" },
    { id: "chicken",   e: "\u{1F414}", name: "Chicken",   say: "The chicken says cluck cluck!" },
    { id: "duck",      e: "\u{1F986}", name: "Duck",      say: "The duck says quack quack!" },
    { id: "bunny",     e: "\u{1F430}", name: "Bunny",     say: "The bunny goes hop hop hop!" },
    { id: "mouse",     e: "\u{1F42D}", name: "Mouse",     say: "The mouse says squeak squeak!" },
    { id: "lion",      e: "\u{1F981}", name: "Lion",      say: "The lion says roar!" },
    { id: "tiger",     e: "\u{1F42F}", name: "Tiger",     say: "The tiger says grrr!" },
    { id: "elephant",  e: "\u{1F418}", name: "Elephant",  say: "The elephant says toot toot!" },
    { id: "monkey",    e: "\u{1F435}", name: "Monkey",    say: "The monkey says ooh ooh ah ah!" },
    { id: "giraffe",   e: "\u{1F992}", name: "Giraffe",   say: "The giraffe has a long, long neck!" },
    { id: "zebra",     e: "\u{1F993}", name: "Zebra",     say: "The zebra has black and white stripes!" },
    { id: "bear",      e: "\u{1F43B}", name: "Bear",      say: "The bear says grrr!" },
    { id: "panda",     e: "\u{1F43C}", name: "Panda",     say: "The panda loves to eat bamboo!" },
    { id: "frog",      e: "\u{1F438}", name: "Frog",      say: "The frog says ribbit!" },
    { id: "fish",      e: "\u{1F41F}", name: "Fish",      say: "The fish goes blub blub!" },
    { id: "whale",     e: "\u{1F433}", name: "Whale",     say: "The whale goes splash!" },
    { id: "dolphin",   e: "\u{1F42C}", name: "Dolphin",   say: "The dolphin says eee eee!" },
    { id: "octopus",   e: "\u{1F419}", name: "Octopus",   say: "The octopus has eight wiggly arms!" },
    { id: "turtle",    e: "\u{1F422}", name: "Turtle",    say: "The turtle goes slow, slow, slow!" },
    { id: "snake",     e: "\u{1F40D}", name: "Snake",     say: "The snake says hissss!" },
    { id: "bird",      e: "\u{1F426}", name: "Bird",      say: "The bird says tweet tweet!" },
    { id: "owl",       e: "\u{1F989}", name: "Owl",       say: "The owl says hoo hoo!" },
    { id: "penguin",   e: "\u{1F427}", name: "Penguin",   say: "The penguin goes waddle waddle!" },
    { id: "butterfly", e: "\u{1F98B}", name: "Butterfly", say: "The butterfly goes flutter flutter!" },
    { id: "bee",       e: "\u{1F41D}", name: "Bee",       say: "The bee says buzz buzz!" },
    { id: "fox",       e: "\u{1F98A}", name: "Fox",       say: "The fox has a big fluffy tail!" },
    { id: "koala",     e: "\u{1F428}", name: "Koala",     say: "The koala loves to hug trees!" },
    { id: "snail",     e: "\u{1F40C}", name: "Snail",     say: "The snail goes slowly, slowly!" },
    { id: "ladybug",   e: "\u{1F41E}", name: "Ladybug",   say: "The ladybug is red with spots!" }
  ];
  var ASSET_VERSION = "1";
  function imgUrl(i) { return "img/" + ANIMALS[i].id + ".jpg?v=" + ASSET_VERSION; }
  function audioUrl(i) { return "audio/" + ANIMALS[i].id + ".mp3?v=" + ASSET_VERSION; }

  var COLORS = ["#FFE08A", "#FFC8DD", "#BDE0FE", "#CDEAC0", "#FFD6A5", "#E2CFFF",
                "#A8E6CF", "#FDFFB6", "#FFADAD", "#9BF6FF", "#CAFFBF", "#FFC6FF"];
  var CONFETTI_COLORS = ["#ff5d8f", "#ffbe0b", "#3a86ff", "#06d6a0", "#8338ec", "#fb5607"];

  var elAnimal = document.getElementById("animal");
  var elEmoji = document.getElementById("emoji");
  var elPrompt = document.getElementById("prompt");
  var elName = document.getElementById("name");
  var elMain = document.getElementById("mainBtn");
  var elBack = document.getElementById("backBtn");
  var elSound = document.getElementById("soundBtn");

  var history = [];   // indices of animals shown, in order
  var pos = -1;       // current position in history
  var deck = [];      // remaining shuffled indices
  var revealed = false;
  var colorIdx = Math.floor(Math.random() * COLORS.length);
  var cardToken = 0;  // increments every card change; stale async callbacks check it

  // ---------- Sound ----------
  var soundOn = true;
  try { soundOn = localStorage.getItem("afc-sound") !== "off"; } catch (e) {}

  // Fallback: device speech synthesis (only used if a recording can't play)
  var synth = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    try {
      var vs = synth.getVoices() || [];
      var en = vs.filter(function (v) { return /^en[-_]/i.test(v.lang) || v.lang === "en"; });
      var pref = ["Samantha", "Karen", "Moira", "Tessa", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira"];
      for (var i = 0; i < pref.length && !voice; i++) {
        for (var j = 0; j < en.length; j++) { if (en[j].name.indexOf(pref[i]) === 0) { voice = en[j]; break; } }
      }
      if (!voice) voice = en.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
    } catch (e) { voice = null; }
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener ? synth.addEventListener("voiceschanged", pickVoice) : (synth.onvoiceschanged = pickVoice); } catch (e) {}
  }
  function speakFallback(parts) {
    if (!synth || !soundOn) return;
    try {
      synth.cancel();
      if (synth.paused) synth.resume();
      parts.forEach(function (text) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = (voice && voice.lang) || "en-US";
        if (voice) u.voice = voice;
        u.rate = 0.8; u.pitch = 1.3; u.volume = 1;
        synth.speak(u);
      });
    } catch (e) { /* speech is optional */ }
  }

  // Pre-recorded child voice (one small MP3 per animal)
  var audioCache = {};
  var playing = null;
  function getAudio(i) {
    var c = audioCache[i];
    if (!c) {
      var a = new Audio();
      a.preload = "auto";
      c = audioCache[i] = { a: a, failed: false, onfail: null };
      a.addEventListener("error", function () { c.failed = true; if (c.onfail) c.onfail(); });
      a.src = audioUrl(i);
      try { a.load(); } catch (e) {}
    }
    return c;
  }
  function stopSound() {
    if (playing) { try { playing.pause(); playing.currentTime = 0; } catch (e) {} playing = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
  }
  function playAnimal(i) {
    stopSound();
    if (!soundOn) return;
    var an = ANIMALS[i], token = cardToken, fellBack = false;
    function fallback() {
      if (fellBack || token !== cardToken || !soundOn) return;
      fellBack = true;
      playing = null;
      speakFallback([an.name + "!", an.say]);
    }
    var c = getAudio(i);
    if (c.failed) {  // retry once with a fresh element, then fall back
      delete audioCache[i];
      c = getAudio(i);
    }
    var a = c.a;
    c.onfail = fallback;
    try {
      a.currentTime = 0;
      playing = a;
      var p = a.play();
      if (p && typeof p.catch === "function") {
        p.catch(function (err) { if (!err || err.name !== "AbortError") fallback(); });
      }
    } catch (e) { fallback(); }
  }

  function renderSoundBtn() {
    elSound.innerHTML = soundOn ? "&#x1F50A;" : "&#x1F507;";
    elSound.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  }
  renderSoundBtn();

  // ---------- Photos ----------
  var imgCache = {};
  function getImg(i) {
    var c = imgCache[i];
    if (!c) {
      var im = new Image();
      im.className = "photo";
      im.alt = "";
      im.draggable = false;
      im.decoding = "async";
      c = imgCache[i] = { img: im, state: "loading" };
      im.onload = function () {
        c.state = "ok";
        if (im.decode) { im.decode().catch(function () {}); }
      };
      im.onerror = function () { c.state = "error"; };
      im.src = imgUrl(i);
    }
    return c;
  }
  var currentImg = null;
  var fallbackTimer = null;
  function showEmoji(i) {
    if (currentImg && currentImg.parentNode) currentImg.parentNode.removeChild(currentImg);
    currentImg = null;
    elEmoji.textContent = ANIMALS[i].e;
    elEmoji.classList.remove("hidden");
  }
  function showPhoto(i) {
    var c = getImg(i), token = cardToken;
    clearTimeout(fallbackTimer);
    if (c.state === "error") {  // try once more (flaky network), emoji meanwhile
      delete imgCache[i];
      showEmoji(i);
      c = getImg(i);
    } else {
      elEmoji.classList.add("hidden");
    }
    var im = c.img;
    if (currentImg !== im) {
      if (currentImg && currentImg.parentNode) currentImg.parentNode.removeChild(currentImg);
      currentImg = im;
      elAnimal.insertBefore(im, elEmoji);
    }
    if (c.state === "ok") { im.classList.remove("loading"); return; }
    // Not loaded yet: keep it invisible (no half-drawn image), reveal when ready
    im.classList.add("loading");
    function done() {
      if (token !== cardToken) return;
      clearTimeout(fallbackTimer);
      if (c.state === "ok") { elEmoji.classList.add("hidden"); im.classList.remove("loading"); }
      else showEmoji(i);
    }
    im.addEventListener("load", done, { once: true });
    im.addEventListener("error", done, { once: true });
    // Very slow network: show the emoji after a few seconds, swap in the photo if it arrives
    fallbackTimer = setTimeout(function () {
      if (token === cardToken && c.state !== "ok") {
        elEmoji.textContent = ANIMALS[i].e;
        elEmoji.classList.remove("hidden");
      }
    }, 4000);
  }

  // ---------- Deck ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function refillDeck(lastShown) {
    deck = shuffle(ANIMALS.map(function (_, i) { return i; }));
    // avoid the same animal twice in a row across a reshuffle
    if (deck.length > 1 && deck[deck.length - 1] === lastShown) {
      var t = deck[0]; deck[0] = deck[deck.length - 1]; deck[deck.length - 1] = t;
    }
  }
  function drawNext() {
    if (!deck.length) refillDeck(history[pos]);
    return deck.pop();
  }
  function peekNext() {
    if (pos < history.length - 1) return history[pos + 1];
    if (!deck.length) refillDeck(history[pos]);
    return deck[deck.length - 1];
  }
  function preloadAround() {
    var n = peekNext();
    getImg(n); getAudio(n);
    if (pos > 0) getImg(history[pos - 1]);
  }

  // ---------- Rendering ----------
  function restartAnim(el, cls) {
    el.classList.remove("pop", "enter");
    void el.offsetWidth; // reflow to restart animation
    if (cls) el.classList.add(cls);
  }

  function showCard() {
    var i = history[pos];
    cardToken++;
    revealed = false;
    colorIdx = (colorIdx + 1 + Math.floor(Math.random() * (COLORS.length - 1))) % COLORS.length;
    document.body.style.setProperty("--bg", COLORS[colorIdx]);
    document.body.style.backgroundColor = COLORS[colorIdx];
    showPhoto(i);
    getAudio(i);
    elAnimal.setAttribute("aria-label", "Who is this?");
    restartAnim(elAnimal, "enter");
    setTimeout(function () { elAnimal.classList.remove("enter"); }, 420);
    elPrompt.classList.remove("hidden");
    elName.classList.add("hidden");
    elName.textContent = "";
    elMain.innerHTML = "Show me! &#x1F440;";
    elMain.classList.remove("next");
    elMain.setAttribute("aria-label", "Show me");
    elBack.disabled = pos <= 0;
    preloadAround();
  }

  function reveal() {
    var i = history[pos], a = ANIMALS[i];
    revealed = true;
    if (window.REWARD) window.REWARD.learnReveal();  // light reward every 5th card
    elPrompt.classList.add("hidden");
    elName.textContent = a.name;
    elName.classList.remove("hidden");
    elAnimal.setAttribute("aria-label", a.name);
    elName.style.animation = "none"; void elName.offsetWidth; elName.style.animation = "";
    restartAnim(elAnimal, "pop");
    elMain.innerHTML = "Next &#x27A1;&#xFE0F;";
    elMain.classList.add("next");
    elMain.setAttribute("aria-label", "Next animal");
    confetti();
    playAnimal(i);
  }

  function next() {
    stopSound();
    if (pos < history.length - 1) { pos++; }
    else { history.push(drawNext()); pos = history.length - 1; }
    showCard();
  }

  function back() {
    if (pos <= 0) return;
    stopSound();
    pos--;
    showCard();
  }

  // Debounce so rapid toddler taps don't skip cards (touch-action: manipulation
  // in CSS already disables double-tap zoom on iOS 13+ / Chrome).
  var lastAdvance = 0;
  function advance() {
    var now = Date.now();
    if (now - lastAdvance < 450) return;
    lastAdvance = now;
    if (revealed) next(); else reveal();
  }

  var confettiLive = 0;
  function confetti() {
    if (confettiLive > 0) return; // keep it light if tapping fast
    var n = 18;
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      d.className = "confetti" + (i % 3 === 0 ? " sq" : "");
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var dist = 25 + Math.random() * 20; // in vmin
      d.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "vmin");
      d.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "vmin");
      d.style.setProperty("--rot", Math.round(Math.random() * 540 - 270) + "deg");
      d.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      document.body.appendChild(d);
      confettiLive++;
      (function (node) {
        setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); confettiLive--; }, 1150);
      })(d);
    }
  }

  // ---------- Input ----------
  // Tap anywhere (except parent controls / credits link) = reveal / next.
  document.addEventListener("click", function (ev) {
    if (document.body.classList.contains("pm-alt")) return;  // a challenge mode is showing
    var t = ev.target;
    if (t.closest && t.closest(".parent, #credits, #moreGames")) return;
    advance();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  elBack.addEventListener("click", function (ev) { ev.stopPropagation(); back(); elBack.blur(); });
  elSound.addEventListener("click", function (ev) {
    ev.stopPropagation();
    soundOn = !soundOn;
    try { localStorage.setItem("afc-sound", soundOn ? "on" : "off"); } catch (e) {}
    if (!soundOn) stopSound();
    renderSoundBtn();
    elSound.blur();
  });

  document.addEventListener("keydown", function (ev) {
    if (document.body.classList.contains("pm-alt")) return;  // a challenge mode is showing
    var k = ev.key;
    if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "Enter") {
      ev.preventDefault();
      if (!ev.repeat) advance();
    } else if (k === "ArrowLeft") {
      ev.preventDefault();
      if (!ev.repeat) back();
    }
  });

  // Block pinch-zoom (iOS Safari ignores user-scalable=no) and double-tap zoom.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // Test hook (read-only state for automated checks)
  window.__afc = { animals: ANIMALS, current: function () { return ANIMALS[history[pos]]; },
                   img: function () { return currentImg; }, revealed: function () { return revealed; } };
  window.__learnStop = stopSound;  // used by play/play.js when switching modes

  // Start
  next();
})();
</script>

<script src="play/animals.js?v=3"></script>
