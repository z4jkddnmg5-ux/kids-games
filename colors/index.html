<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#CDEBFF">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2730%27 cy=%2735%27 r=%2724%27 fill=%27%23e53935%27/%3E%3Ccircle cx=%2770%27 cy=%2735%27 r=%2724%27 fill=%27%23fdd835%27/%3E%3Ccircle cx=%2730%27 cy=%2770%27 r=%2724%27 fill=%27%2343a047%27/%3E%3Ccircle cx=%2770%27 cy=%2770%27 r=%2724%27 fill=%27%231e63e0%27/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/cardsans.woff2" as="font" type="font/woff2" crossorigin>
<title>Color Flash Cards</title>
<link rel="stylesheet" href="../play/play.css?v=3">
<link rel="stylesheet" href="../shared/reward.css?v=4">
<style>
  /* "LetterCardsSans": Latin-only subset of Andika Bold (SIL International, SIL Open Font License 1.1),
     renamed per the OFL Reserved Font Name rule. Shared by the Colors and Days games. */
  @font-face {
    font-family: "LetterCardsSans";
    font-weight: 400 900; font-style: normal; font-display: block;
    src: url(../fonts/cardsans.woff2) format("woff2");
  }
  :root { --bg: #FFE08A; --ink: #e63971; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    transition: background-color .6s ease;
    font-family: "LetterCardsSans", "Andika", "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700; color: #3a2e5c; cursor: pointer;
  }
  #stage {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2vh;
    padding: max(env(safe-area-inset-top), 64px) max(env(safe-area-inset-right), 3vw)
             max(env(safe-area-inset-bottom), 3vh) max(env(safe-area-inset-left), 3vw);
  }
  #photoWrap {
    width: min(84vw, 40vh); aspect-ratio: 1 / 1;
    border-radius: min(6vw, 3.5vh); background: #fff;
    padding: min(2.2vw, 1.1vh);
    box-shadow: 0 1.2vh 2.4vh rgba(58,46,92,.18);
    animation: photoIn .55s cubic-bezier(.3,1.5,.5,1) both;
    flex: none;
  }
  #photo {
    display: block; width: 100%; height: 100%; object-fit: cover;
    border-radius: min(4.5vw, 2.6vh); background: #f3f0f7;
    -webkit-user-drag: none; pointer-events: none;
  }
  #label { min-height: 10vh; display: flex; align-items: center; justify-content: center; text-align: center; }
  #prompt { font-size: min(6.5vh, 9.5vw); font-weight: 700; opacity: .75; }
  #word {
    font-size: min(10vh, 15vw); font-weight: 700; line-height: 1.1; letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 .6vh 0 rgba(58,46,92,.35), 0 0 2vh rgba(58,46,92,.2);
    -webkit-text-stroke: max(2px, .35vh) #3a2e5c; paint-order: stroke fill;
    white-space: nowrap;
    animation: nameIn .55s cubic-bezier(.3,1.6,.5,1) both;
  }
  #word .first { color: var(--ink); font-size: 1.15em; }
  .hidden { display: none !important; }
  #mainBtn {
    font: inherit; font-size: min(6vh, 8vw); font-weight: 700; color: #fff;
    background: #ff7aa2; border: none; border-radius: 999px;
    min-height: 10.5vh; min-width: min(60vw, 50vh); padding: 1.4vh 6vh;
    box-shadow: 0 1vh 0 rgba(0,0,0,.18);
    cursor: pointer; touch-action: manipulation;
    transition: transform .1s, box-shadow .1s, background-color .3s;
    flex: none;
  }
  #mainBtn.next { background: #5bbf8a; }
  #mainBtn:active { transform: translateY(.8vh); box-shadow: 0 .2vh 0 rgba(0,0,0,.18); }
  #mainBtn:focus { outline: none; }
  #mainBtn:focus-visible { outline: 4px solid #3a2e5c; outline-offset: 4px; }
  .emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

  /* Parent controls: small, top corners, semi-transparent */
  .parent {
    position: fixed; top: max(env(safe-area-inset-top), 8px); z-index: 10;
    width: 44px; height: 44px; border-radius: 12px;
    border: 2px solid rgba(58,46,92,.25); background: rgba(255,255,255,.45);
    color: #3a2e5c; font-size: 22px; line-height: 1; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
    opacity: .55; cursor: pointer; touch-action: manipulation;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .parent:active { opacity: 1; }
  #backBtn { left: max(env(safe-area-inset-left), 8px); }
  #moreGames {
    position: fixed; z-index: 10;
    left: max(env(safe-area-inset-left), 6px); bottom: max(env(safe-area-inset-bottom), 4px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; line-height: 1.2;
    color: #3a2e5c; opacity: .45; text-decoration: none; padding: 6px;
  }
  #soundBtn { right: max(env(safe-area-inset-right), 8px); }
  #orderBtn { right: calc(max(env(safe-area-inset-right), 8px) + 52px); }
  #backBtn:disabled { opacity: .2; }
  #credits {
    position: fixed; z-index: 10;
    right: max(env(safe-area-inset-right), 6px); bottom: max(env(safe-area-inset-bottom), 4px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400;
    color: #3a2e5c; opacity: .35; text-decoration: none; padding: 6px;
  }
  #toast {
    position: fixed; z-index: 11; top: calc(max(env(safe-area-inset-top), 8px) + 52px); right: max(env(safe-area-inset-right), 8px);
    font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600;
    background: rgba(58,46,92,.8); color: #fff; padding: 6px 10px; border-radius: 10px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  .confetti {
    position: fixed; top: 45%; left: 50%;
    width: 2.2vh; height: 2.2vh; border-radius: 50%;
    pointer-events: none; z-index: 5;
    animation: burst 1.1s ease-out forwards; will-change: transform, opacity;
  }
  .confetti.sq { border-radius: 3px; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-1.5vh) rotate(1.5deg); } }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.15) rotate(-5deg); } 65% { transform: scale(.96) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes enter { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes nameIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes photoIn { from { transform: scale(.5) rotate(-4deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.6); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  /* Big paint blob */
  #blob {
    width: min(50vh, 78vw); height: min(50vh, 78vw);
    flex: none;
    transition: width .35s cubic-bezier(.3,1.3,.5,1), height .35s cubic-bezier(.3,1.3,.5,1);
    will-change: transform;
    filter: drop-shadow(0 1.2vh 1.4vh rgba(58,46,92,.22));
  }
  #blob svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #blob.float { animation: float 3s ease-in-out infinite; }
  #blob.pop { animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
  #blob.enter { animation: enter .45s ease-out both; }
  #blobPath { transition: fill .3s; }
  #stage.rev #blob { width: min(12vh, 20vw); height: min(12vh, 20vw); }
  #orderBtn .rb { font-size: 22px; }

  @media (orientation: landscape) {
    #stage { padding-top: max(env(safe-area-inset-top), 3vh); gap: 2vh; }
    #blob { width: min(56vh, 40vw); height: min(56vh, 40vw); }
    #stage.rev {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto auto;
      grid-template-areas: "photo blob" "photo label" "photo btn";
      column-gap: 6vw; row-gap: 2vh;
      justify-content: center; align-content: center; align-items: center; justify-items: center;
      padding-left: max(env(safe-area-inset-left), 64px); padding-right: max(env(safe-area-inset-right), 64px);
    }
    #stage.rev #photoWrap { grid-area: photo; width: min(74vh, 44vw); }
    #stage.rev #blob { grid-area: blob; width: min(20vh, 12vw); height: min(20vh, 12vw); }
    #stage.rev #label { grid-area: label; min-height: 0; }
    #stage.rev #mainBtn { grid-area: btn; }
    #word { font-size: min(14vh, 8vw); }
    #prompt { font-size: min(8vh, 6vw); }
    #mainBtn { min-height: 13vh; font-size: min(7.5vh, 5vw); padding: 1vh 6vh; min-width: min(40vw, 60vh); }
    #toast { top: max(env(safe-area-inset-top), 8px); right: calc(max(env(safe-area-inset-right), 8px) + 104px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #blob, #blob.float, #blob.pop, #blob.enter, #word, #photoWrap { animation: none !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<button id="backBtn" class="parent" type="button" aria-label="Previous card" title="Back (Left arrow)">&#x2B05;&#xFE0F;</button>
<button id="orderBtn" class="parent" type="button" aria-label="Order: rainbow" title="Rainbow order / Mix"><span class="rb">&#x1F308;</span></button>
<button id="soundBtn" class="parent" type="button" aria-label="Sound on" title="Sound on/off">&#x1F50A;</button>
<a id="credits" href="credits.html">Photo credits</a>
<a id="moreGames" href="../games.html">&#x25A6; More games</a>
<div id="toast" role="status" aria-live="polite"></div>

<main id="stage">
  <div id="blob" class="float" role="img" aria-label="What color is this?">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <path id="blobPath" fill="#e53935" stroke="rgba(58,46,92,.28)" stroke-width="5" stroke-linejoin="round" d=""/>
      <ellipse id="shine" cx="70" cy="62" rx="22" ry="13" fill="#fff" opacity=".35" transform="rotate(-30 70 62)"/>
      <ellipse cx="104" cy="50" rx="6" ry="4" fill="#fff" opacity=".3"/>
    </svg>
  </div>
  <div id="photoWrap" class="hidden"><img id="photo" alt="" decoding="async" draggable="false"></div>
  <div id="label">
    <div id="prompt">What color is this?</div>
    <div id="word" class="hidden" aria-live="polite"></div>
  </div>
  <button id="mainBtn" type="button">Show me! <span class="emo">&#x1F440;</span></button>
</main>

<script>
(function () {
  "use strict";

  // Rainbow order first (red..purple), then the extra everyday colors.
  // hex = the paint color, bg = a contrasting pastel page color, thing = what the photo shows.
  var CARDS = [
    ["red",    "Red",    "#E53935", "#CDEBFF", "a strawberry"],
    ["orange", "Orange", "#FB8C00", "#D7F5E3", "an orange"],
    ["yellow", "Yellow", "#FDD835", "#D9E0FF", "a rubber duck"],
    ["green",  "Green",  "#43A047", "#FFE0EA", "an apple"],
    ["blue",   "Blue",   "#1E63E0", "#FFF1C4", "a little frog"],
    ["purple", "Purple", "#8E3CCB", "#E3F6D2", "grapes"],
    ["pink",   "Pink",   "#FF6FB0", "#D6F1FF", "a flower"],
    ["brown",  "Brown",  "#8D5524", "#FFF0C9", "a teddy bear"],
    ["black",  "Black",  "#1F1F24", "#FFE08A", "a kitty cat"],
    ["white",  "White",  "#FFFFFF", "#BFD9F6", "a snowman"],
    ["gray",   "Gray",   "#8C8C96", "#FFD6A5", "an elephant"]
  ].map(function (c) {
    return { id: c[0], name: c[1], hex: c[2], bg: c[3], ink: c[2], thing: c[4],
             alt: c[1] + " like " + c[4],
             img: "img/" + c[0] + ".jpg", audio: "audio/" + c[0] + ".mp3",
             say: c[1] + "! " + c[1] + " like " + c[4] + "!" };
  });

  // A few friendly paint-splat shapes (viewBox 0 0 200 200)
  var BLOBS = [
    "M100 14C138 12 176 36 184 78C192 120 170 166 128 182C88 196 38 184 20 146C4 110 18 60 50 34C64 22 82 15 100 14Z",
    "M96 12C132 8 170 28 182 64C194 100 186 142 156 168C126 192 76 194 44 172C14 150 6 108 18 72C30 38 60 16 96 12Z",
    "M108 16C146 22 182 54 184 96C186 140 156 178 112 186C70 194 26 170 16 128C6 88 26 44 60 26C74 18 92 14 108 16Z",
    "M100 10C124 22 148 16 170 38C192 60 186 90 190 116C194 146 170 176 138 186C106 196 72 192 44 174C18 156 8 124 14 94C20 62 30 42 52 26C68 14 80 2 100 10Z"
  ];
  var blobIdx = 0;
  var elBlob = document.getElementById("blob"), elBlobPath = document.getElementById("blobPath");

  var GAME = {
    key: "cfc",
    orderHtml: '<span class="rb">&#x1F308;</span>',
    orderName: "Rainbow",
    nextLabel: "Next color",
    renderQuestion: function (c) {
      blobIdx = (blobIdx + 1 + Math.floor(Math.random() * (BLOBS.length - 1))) % BLOBS.length;
      elBlobPath.setAttribute("d", BLOBS[blobIdx]);
      elBlobPath.setAttribute("fill", c.hex);
      elBlob.setAttribute("aria-label", "What color is this?");
      restartAnim(elBlob, "enter");
      var tok = cardToken;
      setTimeout(function () { if (tok === cardToken && !revealed) { elBlob.classList.remove("enter"); elBlob.classList.add("float"); } }, 460);
    },
    renderReveal: function (c) {
      elBlob.setAttribute("aria-label", c.name);
      restartAnim(elBlob, "pop");
    },
    confettiColors: function (c) { return [c.hex, c.hex, c.hex, "#ffffff", c.hex, "#ffbe0b"]; }
  };
  // ---------- Shared flash-card engine (question -> reveal -> next) ----------
  // Expects: CARDS (array of {id,name,say,img,audio,bg,ink}), GAME = {key, orderHtml, orderName,
  //          nextLabel, renderQuestion(card, el), renderReveal(card), confettiColors(card)}
  var N = CARDS.length;
  var CONFETTI_COLORS = ["#ff5d8f", "#ffbe0b", "#3a86ff", "#06d6a0", "#8338ec", "#fb5607"];
  var $ = function (id) { return document.getElementById(id); };
  var elStage = $("stage"), elPhotoWrap = $("photoWrap"), elPhoto = $("photo");
  var elPrompt = $("prompt"), elWord = $("word"), elMain = $("mainBtn");
  var elBack = $("backBtn"), elSound = $("soundBtn"), elOrder = $("orderBtn"), elToast = $("toast");

  var history = [], pos = -1, deck = [];
  var revealed = false, revealAt = 0, cardToken = 0;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var soundOn = load(GAME.key + "-sound") !== "off";
  var mix = load(GAME.key + "-mix") === "on";

  // ---------- Sound: recorded child voice; speechSynthesis only as a fallback ----------
  var synth = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    try {
      var vs = synth.getVoices() || [];
      var en = vs.filter(function (v) { return /^en[-_]/i.test(v.lang) || v.lang === "en"; });
      var pref = ["Samantha", "Karen", "Moira", "Tessa", "Google US English", "Microsoft Ana", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira"];
      for (var i = 0; i < pref.length && !voice; i++) {
        for (var j = 0; j < en.length; j++) { if (en[j].name.indexOf(pref[i]) === 0) { voice = en[j]; break; } }
      }
      if (!voice) voice = en.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
    } catch (e) { voice = null; }
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener ? synth.addEventListener("voiceschanged", pickVoice) : (synth.onvoiceschanged = pickVoice); } catch (e) {}
  }
  function speakFallback(text) {
    if (!synth || !soundOn) return;
    try {
      synth.cancel();
      if (synth.paused) synth.resume();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = (voice && voice.lang) || "en-US";
      if (voice) u.voice = voice;
      u.rate = 0.8; u.pitch = 1.3; u.volume = 1;
      synth.speak(u);
    } catch (e) { /* sound is optional */ }
  }
  var audioCache = {}, playing = null;
  function getAudio(i) {
    var c = audioCache[i];
    if (!c) {
      var a = null;
      try { a = new Audio(); } catch (e) { a = null; }
      c = audioCache[i] = { a: a, failed: !a, onfail: null };
      if (a) {
        a.preload = "auto";
        a.addEventListener("error", function () { c.failed = true; if (c.onfail) c.onfail(); });
        a.src = CARDS[i].audio;
        try { a.load(); } catch (e) {}
      }
    }
    return c;
  }
  function stopSound() {
    if (playing) { try { playing.pause(); playing.currentTime = 0; } catch (e) {} playing = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
  }
  function playCard(i) {
    stopSound();
    if (!soundOn) return;
    var card = CARDS[i], token = cardToken, fellBack = false;
    function fallback() {
      if (fellBack || token !== cardToken || !soundOn) return;
      fellBack = true; playing = null;
      speakFallback(card.say);
    }
    var c = getAudio(i);
    if (c.failed) { delete audioCache[i]; c = getAudio(i); }  // retry once with a fresh element
    if (!c.a) { fallback(); return; }
    var a = c.a;
    c.onfail = fallback;
    try {
      a.currentTime = 0;
      playing = a;
      var p = a.play();
      if (p && typeof p.catch === "function") {
        p.catch(function (err) { if (!err || err.name !== "AbortError") fallback(); });
      }
    } catch (e) { fallback(); }
  }

  function renderSoundBtn() {
    elSound.innerHTML = soundOn ? "&#x1F50A;" : "&#x1F507;";
    elSound.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  }
  function renderOrderBtn() {
    elOrder.innerHTML = mix ? "&#x1F500;" : GAME.orderHtml;
    elOrder.setAttribute("aria-label", mix ? "Order: mixed" : "Order: " + GAME.orderName);
    elOrder.title = mix ? "Mixed order (tap for " + GAME.orderName + ")" : GAME.orderName + " order (tap to mix)";
  }
  renderSoundBtn(); renderOrderBtn();
  var toastTimer = null;
  function toast(msg) {
    elToast.textContent = msg; elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 1300);
  }

  // ---------- Deck / order ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // Mix: every card once before any repeats; never the same card twice in a row.
  function refillDeck(exclude) {
    deck = shuffle(CARDS.map(function (_, i) { return i; }).filter(function (i) { return i !== exclude; }));
  }
  function peekNext() {
    if (pos < history.length - 1) return history[pos + 1];
    var cur = pos >= 0 ? history[pos] : -1;
    if (!mix) return (cur + 1) % N;
    if (!deck.length) refillDeck(cur);
    return deck[deck.length - 1];
  }
  function takeNext() {
    var i = peekNext();
    if (mix && pos >= history.length - 1) deck.pop();
    return i;
  }
  var imgCache = {};
  function preload(i) {
    if (i == null || i < 0 || imgCache[i]) return;
    try { var im = new Image(); im.decoding = "async"; im.src = CARDS[i].img; imgCache[i] = im; } catch (e) {}
    getAudio(i);
  }

  // ---------- Rendering ----------
  function restartAnim(el, cls) {
    el.classList.remove("pop", "enter", "float");
    void el.offsetWidth;
    if (cls) el.classList.add(cls);
  }
  function showCard() {
    var i = history[pos], c = CARDS[i];
    cardToken++;
    revealed = false;
    elStage.classList.remove("rev");
    document.body.style.setProperty("--bg", c.bg);
    document.body.style.setProperty("--ink", c.ink);
    document.body.style.backgroundColor = c.bg;
    GAME.renderQuestion(c, i);
    elPhotoWrap.classList.add("hidden");
    elPhotoWrap.dataset.failed = "";
    elPhoto.alt = c.alt || c.name;
    if (elPhoto.getAttribute("src") !== c.img) elPhoto.src = c.img;
    elPrompt.classList.remove("hidden");
    elWord.classList.add("hidden");
    elWord.textContent = "";
    elMain.innerHTML = 'Show me! <span class="emo">&#x1F440;</span>';
    elMain.classList.remove("next");
    elMain.setAttribute("aria-label", "Show me");
    elBack.disabled = pos <= 0;
    getAudio(i);
    preload(peekNext());
  }
  elPhoto.addEventListener("error", function () { elPhotoWrap.dataset.failed = "1"; elPhotoWrap.classList.add("hidden"); });
  elPhoto.addEventListener("load", function () { elPhotoWrap.dataset.failed = ""; if (revealed) elPhotoWrap.classList.remove("hidden"); });

  function reveal() {
    var i = history[pos], c = CARDS[i];
    revealed = true;
    if (window.REWARD) window.REWARD.learnReveal();  // light reward every 5th card
    revealAt = Date.now();
    elStage.classList.add("rev");
    elPrompt.classList.add("hidden");
    elWord.innerHTML = '<span class="first">' + c.name.charAt(0) + "</span>" + c.name.slice(1);
    elWord.classList.remove("hidden");
    elWord.style.animation = "none"; void elWord.offsetWidth; elWord.style.animation = "";
    if (elPhotoWrap.dataset.failed !== "1") elPhotoWrap.classList.remove("hidden");
    elPhotoWrap.style.animation = "none"; void elPhotoWrap.offsetWidth; elPhotoWrap.style.animation = "";
    GAME.renderReveal(c, i);
    elMain.innerHTML = 'Next <span class="emo">&#x27A1;&#xFE0F;</span>';
    elMain.classList.add("next");
    elMain.setAttribute("aria-label", GAME.nextLabel);
    confetti(GAME.confettiColors ? GAME.confettiColors(c) : null);
    playCard(i);
  }
  function next() {
    stopSound();
    var i = takeNext();
    if (pos < history.length - 1) pos++;
    else { history.push(i); pos = history.length - 1; }
    showCard();
  }
  function back() {
    if (pos <= 0) return;
    stopSound();
    pos--;
    showCard();
  }
  // Debounce (0.5 s) so rapid toddler taps don't skip cards.
  var lastAdvance = 0;
  function advance() {
    var now = Date.now();
    if (now - lastAdvance < 500) return;
    lastAdvance = now;
    if (revealed) next(); else reveal();
  }

  var confettiLive = 0;
  function confetti(colors) {
    if (confettiLive > 0) return;
    var pal = colors && colors.length ? colors : CONFETTI_COLORS;
    var n = 20;
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      d.className = "confetti" + (i % 3 === 0 ? " sq" : "");
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var dist = 25 + Math.random() * 20;
      d.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "vmin");
      d.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "vmin");
      d.style.setProperty("--rot", Math.round(Math.random() * 540 - 270) + "deg");
      d.style.background = pal[i % pal.length];
      document.body.appendChild(d);
      confettiLive++;
      (function (node) { setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); confettiLive--; }, 1150); })(d);
    }
  }

  // ---------- Input ----------
  document.addEventListener("click", function (ev) {
    if (document.body.classList.contains("pm-alt")) return;  // a challenge mode is showing
    var t = ev.target;
    if (t.closest && t.closest(".parent, #credits, #moreGames")) return;
    advance();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });
  elBack.addEventListener("click", function (ev) { ev.stopPropagation(); back(); elBack.blur(); });
  elSound.addEventListener("click", function (ev) {
    ev.stopPropagation();
    soundOn = !soundOn;
    store(GAME.key + "-sound", soundOn ? "on" : "off");
    if (!soundOn) stopSound();
    renderSoundBtn();
    toast(soundOn ? "Sound on" : "Sound off");
    elSound.blur();
  });
  elOrder.addEventListener("click", function (ev) {
    ev.stopPropagation();
    mix = !mix;
    store(GAME.key + "-mix", mix ? "on" : "off");
    // keep what's been seen; the order change applies from the next card on
    history = history.slice(0, pos + 1);
    deck = [];
    renderOrderBtn();
    toast(mix ? "Mixed up!" : GAME.orderName);
    preload(peekNext());
    elOrder.blur();
  });
  document.addEventListener("keydown", function (ev) {
    if (document.body.classList.contains("pm-alt")) return;  // a challenge mode is showing
    var k = ev.key;
    if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "Enter") {
      ev.preventDefault();
      if (!ev.repeat) advance();
    } else if (k === "ArrowLeft") {
      ev.preventDefault();
      if (!ev.repeat) back();
    }
  });
  // Block pinch-zoom (iOS Safari ignores user-scalable=no) and double-tap zoom.
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  // Test hook (read-only state for automated checks)
  window.__learnStop = stopSound;  // used by play/play.js when switching modes
  window.__fc = { cards: CARDS, current: function () { return CARDS[history[pos]]; },
                  revealed: function () { return revealed; }, mix: function () { return mix; },
                  photoOk: function () { return elPhoto.complete && elPhoto.naturalWidth > 0; } };
  next();

})();
</script>
